; Launcher appearance and window settings.
; The background path is relative to Launcher.exe and may be JPG, PNG, BMP, or GIF.
[launcher]
title=Back to the Future: The Game
heading=SELECT AN EPISODE
background=background.jpg
icon=launcher.ico
width=960
height=600

; Episode sections are displayed in the same order they appear in this file.
; Forward slashes and backslashes are both supported.
[episode1]
name=Episode 1 - It's About Time!
executable=Episode 1/BackToTheFuture101.exe
preferences=%USERPROFILE%/Documents/Telltale Games/Episode 1/prefs.prop

[episode2]
name=Episode 2 - Get Tannen!
executable=Episode 2/BackToTheFuture102.exe
preferences=%USERPROFILE%/Documents/Telltale Games/Back to the Future 2/prefs.prop

[episode3]
name=Episode 3 - Citizen Brown
executable=Episode 3/BackToTheFuture103.exe
preferences=%USERPROFILE%/Documents/Telltale Games/Back to the Future 3/prefs.prop

[episode4]
name=Episode 4 - Double Visions
executable=Episode 4/BackToTheFuture104.exe
preferences=%USERPROFILE%/Documents/Telltale Games/Back to the Future 4/prefs.prop

[episode5]
name=Episode 5 - OUTATIME
executable=Episode 5/BackToTheFuture105.exe
preferences=%USERPROFILE%/Documents/Telltale Games/Back to the Future 5/prefs.prop
